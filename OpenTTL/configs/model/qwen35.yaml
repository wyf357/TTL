
defaults:
  - default

# 本地 Qwen3.5-4B（AutoDL 数据盘）；需较新 transformers。
pretrained_model_name_or_path: /root/autodl-tmp/Qwen3.5-4B
trust_remote_code: true
attn_implementation: sdpa
peft:
  enabled: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
