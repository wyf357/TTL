# ERQA Benchmark Evaluation Configuration
#
# Usage:
#   python evaluations/run_erqa.py
#   python evaluations/run_erqa.py model=qwen35_vl_2b online.enabled=false
#
defaults:
  - model: qwen35_2b
  - strategy: tent
  - inference: sglang
  - online: tta
  - train: eval_minimal
  - _self_

# ERQA dataset configuration
tfrecord_path: ./data/erqa.tfrecord

# 兼容旧字段：未使用 model 组时可覆盖
model_path: ${model.pretrained_model_name_or_path}

# 生成参数（SGLang sampling）与 online TTA 协议
erqa:
  max_new_tokens: 16000
  # Match SGLang/HF apply_chat_template for prompt + TTA batch (Qwen3.5 thinking).
  enable_thinking: true
  # If true, reading example['answer'] before the TTA update raises (audit-friendly).
  strict_no_label_feedback: false

# Evaluation settings
max_examples: null
start_example: 0

# Output configuration
output_json: outputs/erqa_results.json
