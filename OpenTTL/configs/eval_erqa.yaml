# ERQA Benchmark Evaluation Configuration
#
# This configuration is for evaluating vision-language models on the ERQA benchmark.
# ERQA contains multimodal interleaved images and text as multiple-choice questions.
#
# Usage:
#   python evaluations/run_erqa.py
#
# With custom paths:
#   python evaluations/run_erqa.py \
#     tfrecord_path=/path/to/erqa.tfrecord \
#     model_path=/root/autodl-tmp/Qwen3.5-2B \
#     max_examples=10
#
# Using Qwen3.5-2B config:
#   python evaluations/run_erqa.py --config-name=eval_erqa model=qwen35_2b

defaults:
  - _self_

# ERQA dataset configuration
tfrecord_path: ./data/erqa.tfrecord

# Model configuration
# Path to local Qwen3.5 model (can be overridden)
model_path: /root/autodl-tmp/Qwen3.5-2B

# Evaluation settings
# Maximum number of examples to evaluate (null for all 400 examples)
max_examples: null

# Output configuration
output_json: outputs/erqa_results.json
