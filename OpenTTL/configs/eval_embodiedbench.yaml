# EmbodiedBench 桥接：字段与官方 embodiedbench/configs/{eb_env}.yaml 对齐，并增加 eb_env / tta。
# 本地 LMDeploy（model_type=local）推荐用脚本（自动设置 PYTHONPATH）:
#   bash scripts/run_embodiedbench_embench.sh eb_env=eb-alf
# 一键跑通（推荐顺序）：
#   1) bash scripts/setup_embodiedbench_env.sh          # embench venv；EB-ALFRED 需 ai2thor==2.1.0（脚本已固定）
#   2) bash scripts/download_eb_alfred_dataset.sh       # 数据（若 json_2.1.0 已就绪可跳过）
#   3) bash scripts/verify_embodiedbench_readiness.sh   # Python/数据/模型
#   4) bash scripts/verify_nvidia_x_stack.sh            # GPU+X+GLX（先 export DISPLAY=:N 再测）
#   5a) 有 NVIDIA 真 X：另 tmux 起 startx 后 → bash scripts/run_embodiedbench_autodl.sh
#   5b) 仅软件显示：bash scripts/run_embodiedbench_with_xvfb.sh   # 内部起 Xvfb 再调 autodl 脚本
# Hydra 覆盖示例：selected_indexes='[0]' n_shots=1 exp_name=smoke
defaults:
  - _self_

eb_env: eb-alf

# 可改为本机已下载的 Hugging Face 目录或 Hub id；需与当前 lmdeploy 版本支持的 VLM 架构一致。
model_name: OpenGVLab/InternVL2_5-4B
model_type: local
down_sample_ratio: 1.0
language_only: false
eval_sets: []
chat_history: false
n_shots: 10
detection_box: false
multistep: false
resolution: 500
exp_name: openttl_bridge
env_feedback: true
tp: 1
multiview: false
visual_icl: false
truncate: true
start_epi_index: 0
selected_indexes: []

# 首期 TTA：instruction_entropy 使用下方 OpenTTL model 组（与 EB planner 独立）
tta:
  enabled: false
  backend: none
  lr: 0.0001
  max_instruction_chars: 2048
  max_length: 512
  strategy:
    epsilon: 1.0e-8
