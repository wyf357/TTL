# EmbodiedBench 桥接：字段与官方 embodiedbench/configs/{eb_env}.yaml 对齐，并增加 eb_env / tta。
#
# 运行方式（无显示器环境，使用 Xvfb）：
#   bash scripts/run_embodiedbench_with_xvfb.sh
#
# 前置准备：
#   1) bash scripts/setup_embodiedbench_env.sh          # 安装依赖
#   2) bash scripts/download_eb_alfred_dataset.sh       # 下载数据集
#   3) bash scripts/verify_embodiedbench_readiness.sh   # 验证环境
#
# Hydra 覆盖示例：selected_indexes='[0]' n_shots=1 exp_name=smoke
# 本地 Qwen3.5-2B（默认 autodl-tmp 路径）：--config-name=eval_embodiedbench_qwen35_2b
defaults:
  - _self_

eb_env: eb-alf

# 可改为本机已下载的 Hugging Face 目录或 Hub id；需与当前 lmdeploy 版本支持的 VLM 架构一致。
model_name: OpenGVLab/InternVL2_5-4B
model_type: local
down_sample_ratio: 1.0
language_only: false
eval_sets: []
chat_history: false
n_shots: 10
detection_box: false
multistep: false
resolution: 500
exp_name: openttl_bridge
env_feedback: true
tp: 1
multiview: false
visual_icl: false
truncate: true
start_epi_index: 0
selected_indexes: []

# 首期 TTA：instruction_entropy 使用下方 OpenTTL model 组（与 EB planner 独立）
tta:
  enabled: false
  backend: none
  lr: 0.0001
  max_instruction_chars: 2048
  max_length: 512
  strategy:
    epsilon: 1.0e-8
