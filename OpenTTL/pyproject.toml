[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openttl"
version = "0.1.0"
description = "Test-time adaptation for decoder-only causal LMs (TRL/PEFT/Accelerate stack)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "torchaudio>=2.4.0",
  "transformers>=4.50.0",
  "peft>=0.14.0",
  "accelerate>=1.0.0",
  "trl>=0.12.0",
  "datasets>=3.0.0",
  "hydra-core>=1.3.0",
  "omegaconf>=2.3.0",
  "sentencepiece>=0.2.0",
  "protobuf>=3.20.0",
  "wandb>=0.18.0",
  "lm-eval>=0.4.0",
  "flash-attn>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
tensorboard = ["tensorboard>=2.14"]
# EmbodiedBench 本体依赖由上游 conda / 手动安装为主；此处仅声明可编辑安装入口。
embodiedbench = ["embodiedbench @ git+https://github.com/EmbodiedBench/EmbodiedBench.git"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
